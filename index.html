<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Eine minimalistische Python-IDE für den Browser." />
    <title>Python Editor</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="ide" id="ide">
      <section class="editor" aria-label="Python Editor">
        <div class="actions" aria-label="Dateiaktionen">
          <input id="fileInput" type="file" accept=".py,text/x-python,text/plain" hidden />
          <button class="button secondary" id="uploadButton" type="button" title="Python-Datei öffnen">
            <span aria-hidden="true">↑</span> Hochladen
          </button>
          <button class="button secondary" id="downloadButton" type="button" title="Python-Datei speichern">
            <span aria-hidden="true">↓</span> Herunterladen
          </button>
          <button class="button primary" id="runButton" type="button" title="Code ausführen (Strg/⌘ + Enter)">
            <span aria-hidden="true">▶</span> <span id="runLabel">Ausführen</span>
          </button>
        </div>

        <div class="code-shell">
          <pre id="highlighting" aria-hidden="true"></pre>
          <textarea id="codeInput" aria-label="Python-Code" aria-describedby="shortcutHint" spellcheck="false">def fibonacci(anzahl):
    folge = [0, 1]
    while len(folge) < anzahl:
        folge.append(folge[-1] + folge[-2])
    return folge[:anzahl]


print("Hallo aus Python!")
print(fibonacci(10))</textarea>
        </div>
        <span id="shortcutHint" class="visually-hidden">Mit Steuerung oder Command und Enter wird der Code ausgeführt.</span>
      </section>

      <div class="resize-handle" id="resizeHandle" role="separator" aria-label="Terminalgröße ändern" aria-orientation="horizontal" tabindex="0">
        <span></span>
      </div>

      <section class="terminal" id="terminal" aria-label="Terminal">
        <div class="terminal-heading">
          <span>Terminal</span>
          <button id="clearButton" type="button">Leeren</button>
        </div>
        <div class="terminal-output" id="output" role="log" aria-live="polite">
          <div class="terminal-line muted"><span class="prompt">›</span> Bereit.</div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
